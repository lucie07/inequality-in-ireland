    // geolocate control 
    map.addControl(
        new mapboxgl.GeolocateControl({
            positionOptions: {
                enableHighAccuracy: true
            },
            trackUserLocation: true
        })
    );

    map.addControl(
        new MapboxGeocoder({
            accessToken: mapboxgl.accessToken,

// limit results to Ireland
            countries: 'ie',
            types: 'country, region, place, poi',
            //country, region, postcode, district, place, locality, neighborhood, address, and poi

            mapboxgl: mapboxgl
        })
    );

    map.on('load', function() {
        map.addSource('places', {
            'type': 'geojson',
            'data': {
                'type': 'FeatureCollection',
                'features': [
                    {
                        'type': 'Feature',
                        'properties': {
                            'description':
                                '<strong>Dublin City</strong>' +
                                '<p> Dublin’s premiership as the most income-rich region ' +
                                'in the state remains unchallenged. In 2016 the income of a typical Dubliner was just under a fifth higher than the national ' +
                                'average. Though its relative income fell in the 2000s, in 2016 its level is as it was in 2000. Unemployment in Dublin was ' +
                                'more than two percentage points lower than in the Mid-West. ' +
                                '<a href="https://www.cso.ie/en/databases/" target="_blank" title="Link the user to extra info">' +
                                'Go exploring neighbourhood characteristics and regional differences</a></p>',
                            'icon': 'rocket'
                        },
                        'geometry': {
                            'type': 'Point',
                            'coordinates': [-6.255, 53.344]
                        }
                    }
            ]
        }
    });
    // Add a layer showing the places.
    map.addLayer({
        'id': 'places',
        'type': 'symbol',
        'source': 'places',
        'layout': {
            'icon-image': '{icon}-15',
            'icon-allow-overlap': true
        }
    });

    // When a click event occurs on a feature in the places layer, open a popup at the
    // location of the feature, with description HTML from its properties.
    map.on('click', 'places', function(e) {
        var coordinates = e.features[0].geometry.coordinates.slice();
        var description = e.features[0].properties.description;

// Ensure that if the map is zoomed out such that multiple
// copies of the feature are visible, the popup appears
// over the copy being pointed to.
        while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
            coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
        }

        new mapboxgl.Popup()
            .setLngLat(coordinates)
            .setHTML(description)
            .addTo(map);
    });

    // Change the cursor to a pointer when the mouse is over the places layer.
    map.on('mouseenter', 'places', function() {
        map.getCanvas().style.cursor = 'pointer';
    });

    // Change it back to a pointer when it leaves.
    map.on('mouseleave', 'places', function() {
        map.getCanvas().style.cursor = '';
    });
    });
